[package]
name = "immich-dlna-proxy"
version = "0.1.0"
edition = "2024"
description = "Immich DLNA proxy"
repository = "https://github.com/ku1ik/immich-dlna-proxy"
homepage = "https://github.com/ku1ik/immich-dlna-proxy"
readme = "README.md"
license = "Apache-2.0"
publish = false

[[example]]
name = "fixture-server"
path = "tests/fixtures/run.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
icu_collator = "2"
icu_locale = "2"
libc = "0.2"
quick-xml = "0.38"
rand = { version = "0.9", default-features = false, features = ["thread_rng"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "tracing-log"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
bytes = "1"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "test-util"] }
