[package]
name = "immich-dlna-proxy"
version = "0.1.0"
edition = "2024"
description = "Immich DLNA proxy"
repository = "https://github.com/ku1ik/immich-dlna-proxy"
homepage = "https://github.com/ku1ik/immich-dlna-proxy"
readme = "README.md"
license = "Apache-2.0"
publish = false

[[example]]
name = "fixture-server"
path = "tests/fixtures/run.rs"

[dependencies]
anyhow = "1.0"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
icu_collator = "2"
icu_locale = "2"
libc = "0.2"
quick-xml = "0.38"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1", features = ["full", "test-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tower = "0.5"
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
